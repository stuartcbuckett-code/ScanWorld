[package]
name = "scanlod"
version = "1.0.0"
edition = "2021"
description = "ScanBench LOD converter: E57, LAS and LAZ to a tiled, streamable octree with a JSON index"
license = "MIT"

[dependencies]
las = { version = "0.11", features = ["laz"] }
e57 = "0.11"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
fs2 = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
